name: MVP mock visual gates
on:
  push:
    branches: [feat/mvp-mockado-human-validation]
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/mvp-mock-visual.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'package*.json'
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Start local build
        run: |
          npm run start > /tmp/7clinic-next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/7clinic-next.log
          exit 1
      - run: node tests/smoke.mjs
      - run: node tests/e2e.mjs
      - run: node tests/validation-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-mock-visual-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: ignore
